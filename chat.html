<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ditto Chat</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: rgba(30, 30, 40, 0.95);
        border-radius: 12px;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        color: #e0e0e0;
      }
      #chat {
        display: flex;
        flex-direction: column;
        height: 100%;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        overflow: hidden;
      }
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #messages::-webkit-scrollbar { width: 4px; }
      #messages::-webkit-scrollbar-track { background: transparent; }
      #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
      .msg { display: flex; max-width: 90%; }
      .msg.user { align-self: flex-end; }
      .msg.assistant { align-self: flex-start; }
      .msg-bubble {
        padding: 6px 10px;
        border-radius: 10px;
        font-size: 13px;
        line-height: 1.4;
        word-wrap: break-word;
      }
      .msg.user .msg-bubble { background: rgba(80,140,255,0.85); color: #fff; border-bottom-right-radius: 3px; }
      .msg.assistant .msg-bubble { background: rgba(255,255,255,0.12); color: #e0e0e0; border-bottom-left-radius: 3px; }
      .typing { display: flex; gap: 4px; padding: 4px 12px 8px; align-items: center; }
      .typing span { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.5); animation: dot 1.4s infinite; }
      .typing span:nth-child(2) { animation-delay: 0.2s; }
      .typing span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes dot { 0%,60%,100% { opacity:0.3; transform:scale(0.8); } 30% { opacity:1; transform:scale(1); } }
      .input-row {
        display: flex;
        border-top: 1px solid rgba(255,255,255,0.1);
        background: rgba(0,0,0,0.2);
      }
      #input {
        flex: 1;
        background: transparent;
        border: none;
        color: #e0e0e0;
        padding: 8px 10px;
        font-size: 13px;
        outline: none;
        font-family: inherit;
      }
      #input::placeholder { color: rgba(255,255,255,0.4); }
      #send {
        background: rgba(80,140,255,0.8);
        border: none;
        color: white;
        padding: 8px 14px;
        cursor: pointer;
        font-size: 11px;
        font-family: inherit;
        border-radius: 0 0 10px 0;
      }
      #send:hover { background: rgba(80,140,255,1); }
      .header {
        padding: 8px 12px;
        font-size: 12px;
        color: rgba(255,255,255,0.5);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        cursor: default;
        user-select: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .close-btn {
        background: none;
        border: none;
        color: rgba(255,255,255,0.4);
        font-size: 16px;
        cursor: pointer;
        padding: 0 4px;
        line-height: 1;
      }
      .close-btn:hover { color: rgba(255,255,255,0.8); }
    </style>
  </head>
  <body>
    <div id="chat">
      <div class="header"><span>Ditto</span><button class="close-btn" id="close-btn">×</button></div>
      <div id="messages"></div>
      <div class="typing" id="typing" style="display:none"><span></span><span></span><span></span></div>
      <div class="input-row">
        <input id="input" type="text" placeholder="Say something..." autofocus />
        <button id="send">Send</button>
      </div>
    </div>
    <script type="module" src="/src/chat-window.ts"></script>
  </body>
</html>
