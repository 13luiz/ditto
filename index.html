<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ditto</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body, #app {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: transparent !important;
      }
      canvas {
        display: block;
        outline: none;
        border: none;
        box-shadow: none;
        background-color: transparent !important;
      }
      #overlay-dom {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: visible;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="pet-canvas"></canvas>
      <div id="overlay-dom"></div>
    </div>
    <script type="module" src="/src/overlay/main.ts"></script>
  </body>
</html>
