<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to Ditto!</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        background: #1e1e1e;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        color: #fff;
        user-select: none;
      }
      #onboarding {
        display: flex;
        flex-direction: column;
        padding: 24px;
        gap: 16px;
        height: 100%;
      }
      .title { font-size: 20px; font-weight: bold; }
      .subtitle { font-size: 13px; color: #aaa; }
      .step { display: none; flex-direction: column; gap: 12px; flex: 1; }
      .step.active { display: flex; }
      .step-title { font-size: 15px; font-weight: bold; margin-bottom: 4px; }
      .field label { display: block; font-size: 11px; color: #ccc; margin-bottom: 4px; }
      .field input, .field select {
        width: 100%;
        padding: 8px;
        border: 1px solid #555;
        border-radius: 4px;
        background: #2a2a2a;
        color: #fff;
        font-size: 13px;
        font-family: inherit;
      }
      .field input:focus, .field select:focus { outline: none; border-color: #6c8cff; }
      .actions { display: flex; gap: 8px; margin-top: auto; }
      .btn {
        flex: 1;
        padding: 10px;
        border: 1px solid #555;
        border-radius: 6px;
        background: #2a2a2a;
        color: #ddd;
        font-size: 13px;
        cursor: pointer;
        font-family: inherit;
      }
      .btn:hover { background: #444; }
      .btn-primary { background: #4a6cf7; border-color: #4a6cf7; color: #fff; }
      .btn-primary:hover { background: #3a5ce7; }
      .btn-skip { background: transparent; border-color: transparent; color: #888; }
    </style>
  </head>
  <body>
    <div id="onboarding">
      <div class="title">Welcome to Ditto!</div>
      <div class="subtitle">Let's set up your new desktop companion.</div>

      <div class="step active" id="step-1">
        <div class="step-title">Step 1: Name your pet</div>
        <div class="field">
          <label for="pet-name">Pet Name</label>
          <input type="text" id="pet-name" placeholder="Ditto" value="Ditto" />
        </div>
      </div>

      <div class="step" id="step-2">
        <div class="step-title">Step 2: Configure AI (optional)</div>
        <div class="field">
          <label for="provider-type">LLM Provider</label>
          <select id="provider-type">
            <option value="">Skip — use rule-based responses</option>
            <option value="openai">OpenAI</option>
            <option value="anthropic">Anthropic</option>
            <option value="ollama">Ollama (Local)</option>
          </select>
        </div>
        <div class="field">
          <label for="api-key">API Key</label>
          <input type="password" id="api-key" placeholder="sk-..." />
        </div>
        <div class="field">
          <label for="model">Model</label>
          <input type="text" id="model" placeholder="gpt-4o" />
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-skip" id="skip-btn">Skip Setup</button>
        <button class="btn btn-primary" id="next-btn">Next</button>
      </div>
    </div>
    <script type="module" src="/src/onboarding-window.ts"></script>
  </body>
</html>
