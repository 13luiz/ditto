<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ditto Settings</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow-y: auto;
        background: #1e1e1e;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        color: #fff;
        user-select: none;
      }
      #settings {
        display: flex;
        flex-direction: column;
        padding: 16px;
        gap: 16px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .title { font-size: 15px; font-weight: bold; }
      .close-btn {
        background: none;
        border: none;
        color: #666;
        font-size: 16px;
        cursor: pointer;
        padding: 0 4px;
      }
      .close-btn:hover { color: #aaa; }
      .section {
        background: rgba(255,255,255,0.05);
        border-radius: 8px;
        padding: 12px;
      }
      .section-title {
        font-size: 12px;
        font-weight: bold;
        color: #aaa;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 10px;
      }
      .field { margin-bottom: 10px; }
      .field:last-child { margin-bottom: 0; }
      .field label {
        display: block;
        font-size: 11px;
        color: #ccc;
        margin-bottom: 4px;
      }
      .field input, .field select {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid #555;
        border-radius: 4px;
        background: #2a2a2a;
        color: #fff;
        font-size: 12px;
        font-family: inherit;
      }
      .field input:focus, .field select:focus {
        outline: none;
        border-color: #6c8cff;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }
      .btn {
        flex: 1;
        padding: 8px;
        border: 1px solid #555;
        border-radius: 6px;
        background: #2a2a2a;
        color: #ddd;
        font-size: 12px;
        cursor: pointer;
        font-family: inherit;
      }
      .btn:hover { background: #444; }
      .btn-primary {
        background: #4a6cf7;
        border-color: #4a6cf7;
        color: #fff;
      }
      .btn-primary:hover { background: #3a5ce7; }
      .status {
        font-size: 11px;
        color: #4caf50;
        text-align: center;
        min-height: 16px;
      }
    </style>
  </head>
  <body>
    <div id="settings">
      <div class="header">
        <span class="title">Settings</span>
        <button class="close-btn" id="close-btn">×</button>
      </div>

      <div class="section">
        <div class="section-title">Appearance</div>
        <div class="field">
          <label for="pet-name">Pet Name</label>
          <input type="text" id="pet-name" placeholder="Ditto" />
        </div>
      </div>

      <div class="section">
        <div class="section-title">LLM Provider</div>
        <div class="field">
          <label for="provider-type">Provider</label>
          <select id="provider-type">
            <option value="">Not configured</option>
            <option value="openai">OpenAI</option>
            <option value="anthropic">Anthropic</option>
            <option value="ollama">Ollama (Local)</option>
          </select>
        </div>
        <div class="field">
          <label for="api-key">API Key</label>
          <input type="password" id="api-key" placeholder="sk-..." />
        </div>
        <div class="field">
          <label for="model">Model</label>
          <input type="text" id="model" placeholder="gpt-4o" />
        </div>
        <div class="field">
          <label for="base-url">Base URL (optional)</label>
          <input type="text" id="base-url" placeholder="https://api.openai.com/v1" />
        </div>
      </div>

      <div class="section">
        <div class="section-title">Behavior</div>
        <div class="field">
          <label for="auto-launch">
            <input type="checkbox" id="auto-launch" style="width:auto;margin-right:6px;" />
            Start with system
          </label>
        </div>
      </div>

      <div class="status" id="status"></div>
      <div class="actions">
        <button class="btn" id="cancel-btn">Cancel</button>
        <button class="btn btn-primary" id="save-btn">Save</button>
      </div>
    </div>
    <script type="module" src="/src/settings-window.ts"></script>
  </body>
</html>
