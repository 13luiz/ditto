[package]
name = "ditto"
version = "0.0.5"
edition = "2021"

[lib]
name = "ditto_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rig-core = "0.35"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
thiserror = "2"
dotenv = "0.15"
dirs = "5"
xcap = "0.6"
image = "0.25"
